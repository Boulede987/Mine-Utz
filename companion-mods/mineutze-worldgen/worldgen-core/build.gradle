// Pure Java, no Minecraft/NeoForge dependency on purpose: this module holds
// the biome graph model and (later) the region-solve algorithm. Keeping it
// free of Minecraft classes means its tests run as plain fast JUnit instead
// of NeoForge's "unit testing mode", which boots a full Minecraft instance
// for the whole test task.
plugins {
    id 'java'
    id 'application'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

application {
    // Standalone region-solve export (PNG/ASCII/JSON) — run with:
    //   ./gradlew :worldgen-core:run --args="<worldSeed> <regionSpan> <outputDir>"
    mainClass = 'com.mineutze.worldgen.export.ExportCli'
}

tasks.register('triangleFieldExport', JavaExec) {
    group = 'application'
    description = 'Visual of the live hex-mesh region-solve path (HexMeshBuilder -> FaceAdjacency -> fused CSP -> WeightedVertexPlacement -> EdgeDisplacementRasterizer -> raster), against the real ModBiomeGraph.DEFAULT. Run with: ./gradlew :worldgen-core:triangleFieldExport --args="<worldSeed> <outputDir>"'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.export.triangle.TriangleFieldRegionExportCli'
}

tasks.register('biomeGraphCompletenessReport', JavaExec) {
    group = 'verification'
    description = 'Exhaustively checks every biome-neighbor combination against ModBiomeGraph.OVERWORLD for a universal legal candidate, caching against the rule set\'s own fingerprint (doc/biome-graph-completeness-cache.txt) - re-run after any real AdjacencyRule change via the Excel planner. Run with: ./gradlew :worldgen-core:biomeGraphCompletenessReport'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.export.BiomeGraphCompletenessReport'
}

tasks.register('deadEndFrequencySimulation', JavaExec) {
    group = 'verification'
    description = 'Real dead-end FREQUENCY (not just existence) against ModBiomeGraph.OVERWORLD - RING_PROBE (deliberate worst case, structure-search-style) and ORGANIC_WALK (real player movement pattern), 100,000 trials each, parallel. Pre-existing tool, was never wired to a gradle task before. Run with: ./gradlew :worldgen-core:deadEndFrequencySimulation'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.export.hex.DeadEndFrequencySimulation'
}

tasks.register('liveDeadEndDiagnosticReport', JavaExec) {
    group = 'verification'
    description = 'Sweeps the real live query path (SeedMeshCache) across 50 seeds for REAL, reachable dead ends - a much smaller, much more actionable list than biomeGraphCompletenessReport\'s own exhaustive abstract sweep. Self-explanatory report (doc/live-dead-end-diagnostic-report.txt): every entry explains the problem and proposes a concrete, verifiable AdjacencyRule fix. Run with: ./gradlew :worldgen-core:liveDeadEndDiagnosticReport'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.export.LiveDeadEndDiagnosticReport'
}

tasks.register('geometricFeasibilityProof', JavaExec) {
    group = 'verification'
    description = 'Exhaustive (not sampled) geometric feasibility proof, one level beyond biomeGraphCompletenessReport: checks every real, physically-placeable partial neighborhood with few abstract legal candidates against the REAL production identity+size solver, at both width extremes (exact bound via WeightedVertexPlacement\'s proven area-monotonicity theorem, not a sampled approximation). Run with: ./gradlew :worldgen-core:geometricFeasibilityProof'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.export.GeometricFeasibilityProof'
}

tasks.register('graphEditorSeed', JavaExec) {
    group = 'application'
    description = 'One-off: writes ModBiomeGraph.OVERWORLD out to the graph editor\'s own data file (src/main/resources/biomegraph/biome-graph.json). Only needed once, or to reset the editor back to a known-good in-memory graph. Run with: ./gradlew :worldgen-core:graphEditorSeed'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.tooling.graphedit.GraphDataSeeder'
}

tasks.register('graphEditor', JavaExec) {
    group = 'application'
    description = 'Local web app for editing the biome adjacency graph (add/remove biomes and adjacencies, live rule-consistency warnings, on-demand deep geometric-feasibility check) - reads/writes the SAME file ModBiomeGraph.OVERWORLD loads, so edits here are production changes. Run with: ./gradlew :worldgen-core:graphEditor, then open http://localhost:8842'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.tooling.graphedit.GraphEditorServer'
}

tasks.register('graphEditorDeepCheck', JavaExec) {
    group = 'verification'
    description = 'The graph editor\'s "Deep check" button - runs the real exhaustive GeometricFeasibilityProof against the editor\'s currently SAVED graph (not the hardcoded catalog directly, though it\'s the same file now). Run with: ./gradlew :worldgen-core:graphEditorDeepCheck'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.tooling.graphedit.GraphEditorDeepCheck'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
    // Default test-worker heap isn't the Gradle daemon's own -Xmx3G (gradle.properties) -
    // it's a separate forked JVM with its own, much smaller default. Needed explicitly
    // once MacroGridConfig.DEFAULT's region size grew enough that a single solved
    // region's assignment map is ~23MB (measured directly) and several tests retain
    // multiple regions in one SeedRegionCache at once - a real OutOfMemoryError at the
    // old default, not a hypothetical.
    maxHeapSize = '3g'
}
