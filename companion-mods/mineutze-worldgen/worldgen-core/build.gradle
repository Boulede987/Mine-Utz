// Pure Java, no Minecraft/NeoForge dependency on purpose: this module holds
// the biome graph model and the per-world biome plan (solver and map). Keeping it
// free of Minecraft classes means its tests run as plain fast JUnit instead
// of NeoForge's "unit testing mode", which boots a full Minecraft instance
// for the whole test task.
plugins {
    id 'java'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.register('graphEditorSeed', JavaExec) {
    group = 'application'
    description = 'One-off: writes ModBiomeGraph.OVERWORLD out to the graph editor\'s own data file (src/main/resources/biomegraph/biome-graph.json). Only needed once, or to reset the editor back to a known-good in-memory graph. Run with: ./gradlew :worldgen-core:graphEditorSeed'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.tooling.graphedit.GraphDataSeeder'
}

tasks.register('graphEditor', JavaExec) {
    group = 'application'
    description = 'Local web app for editing the biome adjacency graph (add/remove biomes and adjacencies, live rule-consistency warnings, on-demand solve check) - reads/writes the SAME file ModBiomeGraph.OVERWORLD loads, so edits here are production changes. Run with: ./gradlew :worldgen-core:graphEditor, then open http://localhost:8842'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.tooling.graphedit.GraphEditorServer'
}

tasks.register('toroidalSolvability', JavaExec) {
    group = 'verification'
    description = 'The evidence for "every world seed solves": many independent single-seed searches against the real catalog, with per-seed solve rate, failure bound and restarts needed. Long-running. Run with: ./gradlew :worldgen-core:toroidalSolvability'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.coherence.ToroidalSolvabilityRunner'
}

tasks.register('toroidalWorldSeedReliability', JavaExec) {
    group = 'verification'
    description = 'End-to-end proof that every world seed solves: the real per-world-seed pattern generator on many different world seeds against the real catalog, one CSV line per world seed. Long-running. Run with: ./gradlew :worldgen-core:toroidalWorldSeedReliability'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.coherence.ToroidalWorldSeedReliabilityRunner'
}

tasks.register('biomeRealizationPrototype', JavaExec) {
    group = 'verification'
    description = 'Prototype: turn a solved 40x40 cell pattern into a map with natural borders via an area-preserving warp, verify it directly (areas, legality, topology) and write pictures to build/realization. Run with: ./gradlew :worldgen-core:biomeRealizationPrototype'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.coherence.BiomeRealizationPrototypeRunner'
}

tasks.register('worldBiomePlanCheck', JavaExec) {
    group = 'verification'
    description = 'Real-scale check of WorldBiomePlan against the real catalog: creation time, lookup speed, tile repeat, snapshot round trip, a raster hash to compare between runs, and a comparison of the solved pattern with the one the reliability study saved. Run with: ./gradlew :worldgen-core:worldBiomePlanCheck'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.coherence.WorldBiomePlanCheckRunner'
}

tasks.register('graphEditorSolveCheck', JavaExec) {
    group = 'verification'
    description = 'The graph editor Solve check button - builds real WorldBiomePlans (the pipeline a new world runs) from the editor currently SAVED graph for a few world seeds and reports per seed whether it solved; exits non-zero if any did not. Takes minutes. Run with: ./gradlew :worldgen-core:graphEditorSolveCheck'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mineutze.worldgen.tooling.graphedit.GraphEditorSolveCheck'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
    // Default test-worker heap isn't the Gradle daemon's own -Xmx3G (gradle.properties) -
    // it's a separate forked JVM with its own, much smaller default. Needed explicitly
    // once MacroGridConfig.DEFAULT's region size grew enough that a single solved
    // region's assignment map is ~23MB (measured directly) and several tests retain
    // multiple regions in one SeedRegionCache at once - a real OutOfMemoryError at the
    // old default, not a hypothetical.
    maxHeapSize = '3g'
}
