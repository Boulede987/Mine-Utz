plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.145'
    id 'java'
}

// Needed so jar{}'s reference to worldgen-core's sourceSets below sees it
// already configured, not an empty/not-yet-evaluated project.
evaluationDependsOn(':worldgen-core')

version = '1.0.0'
group = 'com.mineutze'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
    }
    server { }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    implementation project(':worldgen-core')
}

jar {
    // NeoForge mod jars are standalone - Minecraft only loads this one file from
    // the mods folder, it doesn't resolve sibling Gradle subprojects at runtime.
    // implementation project(':worldgen-core') only puts it on the classpath for
    // dev-environment runs (./gradlew runServer etc). Without this, worldgen-core's
    // classes are simply missing at runtime -> NoClassDefFoundError on level load.
    from project(':worldgen-core').sourceSets.main.output
    manifest {
        attributes(['Implementation-Version': project.version])
    }
}

// After building, copy the jar into the modpack's mods folder for testing
tasks.register('deployMod', Copy) {
    dependsOn jar
    from jar.outputs
    into '../../minecraft/mods'
    rename { "mineutze-worldgen-${project.version}.jar" }
}

// Deploys only this mod's jar into the DEV_TEST PrismLauncher instance's mods
// folder, alongside the debug/utility mods already installed there by hand -
// for testing in isolation from the full modpack, where another worldgen
// mod's own datapack overrides (e.g. Tectonic also shipping a
// noise_settings/overworld.json - datapacks replace that file wholesale, they
// don't merge) can produce symptoms that look like our own bugs but aren't.
// Only deletes this mod's own previously-deployed jar (name-matched), never
// the whole folder - the other installed mods must survive redeploys.
def devTestModsDir = '../../../DEV_TEST/minecraft/mods'

tasks.register('deployToDevTest', Copy) {
    dependsOn jar
    doFirst {
        delete fileTree(devTestModsDir) { include 'mineutze-worldgen-*.jar' }
    }
    from jar.outputs
    into devTestModsDir
    rename { "mineutze-worldgen-${project.version}.jar" }
}
